services:
  db:
    image: mysql:8.0
    container_name: ops-recipe-runner-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sandbox
    ports:
      # ローカル開発用のため localhost からのみ接続可能にする（外部公開しない）
      - "127.0.0.1:3307:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/dump:/docker-entrypoint-initdb.d/dump
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  script:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./src/script:/app/src/script
    depends_on:
      db:
        condition: service_healthy
